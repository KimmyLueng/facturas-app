name: Android APK

# 云端构建 APK：无需本机安装 Android Studio / JDK / SDK
#   Actions → Android APK → Run workflow（手动触发）
#     勾选 create_release 即可直接发布到 Release，无需打 tag
#   打 tag（v1.0.0）时自动构建并发布到 Release
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建后直接发布到 Release（不必打 tag）'
        type: boolean
        default: false
      release_tag:
        description: 'Release 的 tag 名；留空则自动生成 build-<运行号>'
        type: string
        required: false
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 要求构建机 Python 版本与 app/build.gradle 的 version 一致（3.12）
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 规范脚本换行符（CRLF 会让 bash 报 bad interpreter）
        run: find . -name '*.sh' -print0 | xargs -0 perl -pi -e 's/\r\n?/\n/g'

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || true

      - name: 同步 Python 业务代码到 Android 工程
        run: bash platforms/android/build_android.sh --sync-only

      - name: 生成 Gradle Wrapper
        working-directory: platforms/android
        run: gradle wrapper --gradle-version 8.5

      - uses: gradle/actions/setup-gradle@v3

      - name: 构建 Debug APK
        working-directory: platforms/android
        run: ./gradlew assembleDebug --no-daemon
        # 注：Chaquopy 自 12.0.1 起免费开源，无需 license key

      - name: 上传 APK（构件）
        uses: actions/upload-artifact@v6
        with:
          name: GestionFacturas-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

      # 手动发布时决定 Release 用的 tag：优先用输入，留空则 build-<运行号>
      - name: 决定 Release tag
        id: rel
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="build-${{ github.run_number }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.rel.outputs.tag }}
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
